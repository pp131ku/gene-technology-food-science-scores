<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตรวจสอบคะแนน | Gene Technology for Food Science and Food Technology</title>
  <style>
    :root { --ink:#092844; --green:#1261a0; --mint:#eaf4ff; --line:#a9cbed; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Arial,"Noto Sans Thai",sans-serif; color:var(--ink); background:linear-gradient(135deg,#e5f2ff,#f8fcff); }
    main { width:min(100%,540px); padding:42px; background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:0 18px 50px #24674d1a; text-align:center; }
    .tag { display:inline-block; margin-bottom:16px; padding:7px 12px; border-radius:999px; background:var(--mint); color:var(--green); font-size:.82rem; font-weight:700; letter-spacing:.04em; }
    h1 { margin:0; font-size:clamp(1.5rem,4vw,2rem); line-height:1.25; }
    p { margin:14px 0 26px; color:#547068; line-height:1.6; }
    label { display:block; margin-bottom:8px; text-align:left; font-weight:700; }
    .search { display:flex; gap:10px; }
    input,button { min-height:52px; border-radius:12px; font:inherit; }
    input { width:100%; padding:0 15px; border:1px solid #aac8bd; color:var(--ink); outline-color:var(--green); }
    button { padding:0 19px; border:0; background:var(--green); color:#fff; font-weight:700; cursor:pointer; white-space:nowrap; }
    button:hover { background:#0b4778; }
    #result { display:none; margin-top:24px; padding:20px; border-radius:14px; background:var(--mint); }
    #result.error { background:#fff1ef; color:#8d3025; }
    .score { display:block; margin-top:5px; font-size:2.1rem; font-weight:800; color:var(--green); }
    .error .score { color:inherit; font-size:1rem; font-weight:600; }
    .note { margin:21px 0 0; font-size:.82rem; }
    @media (max-width:460px) { main { padding:30px 22px; } .search { flex-direction:column; } button { width:100%; } }
  </style>
</head>
<body>
  <main>
    <div class="tag">GENE TECHNOLOGY FOR FOOD SCIENCE AND FOOD TECHNOLOGY</div>
    <h1>ตรวจสอบคะแนนสอบกลางภาค</h1>
    <p>กรอกรหัสนักศึกษา แล้วกดปุ่มเพื่อแสดงคะแนนของคุณ</p>
    <form id="score-form">
      <label for="student-id">รหัสนักศึกษา</label>
      <div class="search">
        <input id="student-id" name="student-id" inputmode="numeric" autocomplete="off" placeholder="" maxlength="8" required>
        <button type="submit">แสดงคะแนน</button>
      </div>
    </form>
    <section id="result" aria-live="polite"></section>
    <p class="note">หากไม่พบข้อมูล โปรดตรวจสอบรหัสนักศึกษาแล้วลองใหม่อีกครั้ง</p>
  </main>
  <script>
        const scores = Object.freeze({"66080002":4.5,"66080010":9,"66080014":12,"66080017":15,"66080019":23.5,"66080021":5,"66080022":10,"66080024":17,"66080025":7,"66080029":6.5,"66080030":20,"66080034":30,"66080036":14,"66080044":16.5,"66080063":19,"66080067":15.5,"66080078":9.5,"66080095":11.5,"66080100":13,"66080105":20,"66080106":15,"66080118":16,"66080120":18.5,"66080146":30,"66080220":25.5,"66080233":30,"66080235":25});
    const form = document.querySelector('#score-form');
    const input = document.querySelector('#student-id');
    const result = document.querySelector('#result');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const id = input.value.trim();
      const score = scores[id];
      result.style.display = 'block';
      if (Object.hasOwn(scores, id)) {
        result.className = '';
        result.innerHTML = `คะแนนของรหัสนักศึกษา ${id}<span class="score">${score} คะแนน</span>`;
      } else {
        result.className = 'error';
        result.innerHTML = '<span class="score">ไม่พบข้อมูลคะแนนสำหรับรหัสนักศึกษานี้</span>';
      }
    });
  </script>
</body>
</html>
